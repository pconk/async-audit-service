name: Audit Service CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23'

    - name: Install Dependencies
      run: go mod tidy

    - name: Run Unit Tests
      run: go test -v ./...

    - name: Build Application
      run: go build -v internal/cmd/api/main.go